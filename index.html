<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- Define a codificação de caracteres UTF-8 para aceitar acentos e e-cedilha sem quebrar -->
    <meta charset="UTF-8" />

    <!-- Configura a janela de exibição para ajustar o zoom e tamanho do site em telas de celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Define o título que aparece na aba do navegador do usuário -->
    <title>EVE NAIL STUDIO</title>
    <!-- Resumo da página que aparece nos resultados de busca do Google -->
    <meta name="description" content="O EVE NAIL STUDIO é um espaço dedicado para seu momento, com materiais e equipamentos de qualidade, esterealizados. Prontos para deixar suas unhas um arraso! Afinal, você já é linda, vamos realçar isso!">
    <!-- Palavras-chave associadas ao site para mecanismos de busca -->
    <meta name="keywords" content="Unhas, Manicures, Nail Design, Pedicure, Esmaltação em Gel, design de unhas, nail art, unhas decoradas, unhas de gel, unhas de acrílico, cuidados com as unhas, esmaltes, nail care, nail salon, manicure profissional, pedicure profissional, tendências de unhas, nail trends, nail care tips">
    <!-- Identifica o autor ou empresa responsável pela criação da página -->
    <meta name="author" content="EVE NAIL STUDIO">
    <!-- Instrução para os robôs do Google indexarem o site e seguirem seus links -->
    <meta name="robots" content="index, follow">
    <!-- Define a URL Canônica para evitar problemas de conteúdo duplicado no Google -->
    <link rel="canonical" href="https://eve-nail-studio-react.vercel.app/">
    <!-- Define a cor da barra de navegação superior nos celulares (Safari/Chrome Mobile) -->
    <meta name="theme-color" content="#f3ebe3">

    <!-- Configurações do protocolo Open Graph para pré-visualização ao compartilhar no Facebook e WhatsApp -->
    <!-- Define que o tipo de conteúdo compartilhado é um site -->
    <meta property="og:type" content="website">
    <!-- Define o título que aparece ao compartilhar no Facebook e WhatsApp -->
    <meta property="og:title" content="EVE NAIL STUDIO">
    <!-- Define o resumo que aparece ao compartilhar no Facebook e WhatsApp -->
    <meta property="og:description" content="O EVE NAIL STUDIO é um espaço dedicado para seu momento, com materiais e equipamentos de qualidade, esterealizados. Prontos para deixar suas unhas um arraso! Afinal, você já é linda, vamos realçar isso!">
    <!-- Define a imagem que aparece ao compartilhar no Facebook e WhatsApp -->
    <meta property="og:image" content="https://eve-nail-studio-react.vercel.app/images/logo.png">
    <!-- Define a URL da página que aparece ao compartilhar no Facebook e WhatsApp -->
    <meta property="og:url" content="https://eve-nail-studio-react.vercel.app/">
    <!-- [NOVO/MELHORIA]: Define o idioma regional das pré-visualizações nas redes sociais -->
    <meta property="og:locale" content="pt_BR">
    <!-- [NOVO/MELHORIA]: Especifica a largura ideal em pixels da imagem para o WhatsApp/Facebook carregar instantaneamente -->
    <meta property="og:image:width" content="1200">
    <!-- [NOVO/MELHORIA]: Especifica a altura ideal em pixels da imagem de compartilhamento -->
    <meta property="og:image:height" content="630">

    <!-- Configurações para pré-visualização ao compartilhar no Twitter / X -->
    <!-- Exibe a imagem de compartilhamento em formato grande -->
    <meta name="twitter:card" content="summary_large_image">
    <!-- Define o título que aparece ao compartilhar no Twitter / X -->
    <meta name="twitter:title" content="EVE NAIL STUDIO">
    <!-- Define o resumo que aparece ao compartilhar no Twitter / X -->
    <meta name="twitter:description" content="O EVE NAIL STUDIO é um espaço dedicado para seu momento, com materiais e equipamentos de qualidade, esterealizados. Prontos para deixar suas unhas um arraso! Afinal, você já é linda, vamos realçar isso!">
    <!-- Define a imagem que aparece ao compartilhar no Twitter / X -->
    <meta name="twitter:image" content="https://eve-nail-studio-react.vercel.app/images/logo.png">

    <!-- Define o icone que aparecerá na barra de título do navegador -->
    <link rel="icon" type="image/webp" font-size='100' y='1em' viewBox='0 0 100 100' href="/favicon.webp" />

    <!-- Estilos para ícones -->
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-brands/css/uicons-brands.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-straight/css/uicons-regular-straight.css'>
    
    <!-- Estilos para fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Epilogue:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oxygen:wght@300;400;700&family=Public+Sans:ital,wght@0,100..900;1,100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

    
  </head>
  <body class="w-full h-dvh relative bg-[#f3ebe3] font-[Montserrat]">
    <div id="root" class="w-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
